<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 104" width="72" height="104" role="img" aria-label="FlareSeal">
  <title>FlareSeal</title>
  <!--
    Vector redraw of the existing FlareSeal mark (public/brand/flareseal-logo.png), so the same
    identity can be used as a favicon and at small sizes without shipping a 1 MB raster.

    The form is a document with a folded corner that terminates in a shield point: the document is
    the invoice, the shield is the escrow, and the flame is Flare. The chevron and flame are cut as
    negative space so the mark works on any background.
  -->
  <defs>
    <clipPath id="fsBody">
      <path d="M 43 3 L 69 27 V 59 L 36 99 L 3 59 V 9 A 6 6 0 0 1 9 3 Z"/>
    </clipPath>
  </defs>

  <path fill="#F04A23" d="M 43 3 L 69 27 V 59 L 36 99 L 3 59 V 9 A 6 6 0 0 1 9 3 Z"/>

  <!-- Folded page corner. -->
  <path fill="#FFFFFF" d="M 43 3 L 69 27 L 48 27 A 5 5 0 0 1 43 22 Z"/>

  <g clip-path="url(#fsBody)">
    <!-- Chevron band, clipped so it can never spill past the shield edge. -->
    <polyline points="-4,46 36,86 76,46" fill="none" stroke="#FFFFFF" stroke-width="9"
              stroke-linejoin="round"/>
  </g>

  <!-- Flame. -->
  <path fill="#FFFFFF" d="
    M 36 19
    C 42 28, 49 35, 49 44
    C 49 52, 43 58, 36 58
    C 29 58, 23 52, 23 44
    C 23 37, 28 32, 32 25
    C 33 32, 35 35, 36 33
    C 37 30, 36 24, 36 19 Z"/>
</svg>
